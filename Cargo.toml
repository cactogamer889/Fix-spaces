[package]
name = "diskviz"
version = "1.0.0"
edition = "2021"
description = "Fast Windows disk usage analyzer with treemap visualization"
license = "MIT"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
open = "5"
rfd = "0.15"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_Foundation",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
